<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DanceFloorFreak.com</title>
    <style>
        body {
            background-color: #000000;
            color: #cccccc;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            width: 800px;
            max-width: 90vw;
            margin: 20px auto;
        }
        #flash-container {
            position: relative;
            width: 100%;
        }
        video {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #222222;
        }
        .skip-link {
            font-size: 11px;
            color: #cccccc;
            text-decoration: none;
            display: block;
            margin-top: 12px;
        }
        .skip-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        .counter {
            color: #666666;
            font-size: 10px;
            margin-top: 20px;
            letter-spacing: 1px;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
        }
        .counter:hover {
            color: #ff0000;
        }
        #sound-btn {
            background-color: #111111;
            color: #ff0000;
            border: 1px solid #ff0000;
            padding: 8px 16px;
            font-size: 11px;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 12px;
        }
        #sound-btn:hover {
            background-color: #ff0000;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="flash-container">
        <video id="intro-video" autoplay muted playsinline onended="redirectToHome()">
            <source src="intro.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <audio id="intro-audio" src="home/homeloop.mp3" preload="auto"></audio>

    <button id="sound-btn" onclick="toggleSound()">🔊 Enable Sound</button>

    <a href="home/index.html" class="skip-link">Skip intro</a>

    <!-- Interactive Counter -->
    <div class="counter" id="visitor-counter" onclick="updateCounter()" title="Click to refresh counter!">
        You are visitor number <span id="counter-val">000,001 (Thanks, Mom!)</span> to DanceFloorFreak.com!
    </div>
</div>

<script>
const jokes = [
    "<?php echo $count; ?>",
    "[ERROR: counter.txt IS READ-ONLY]",
    "[NaN]",
    "000,001 (Thanks, Mom!)",
    "42,949,672,952 (Counter Reset via Y2K Bug)",
    "8,000,000,000 (Give or take a few million)",
    "000,404 (Visitor Not Found)",
    "014,892 (Counting paused while song buffers...)",
    "[INSERT NUMBER HERE]",
    "I Lost Count"
];

let lastIndex = -1;

function getRandomJoke() {
    let randomIndex;
    // Prevent picking the exact same joke twice in a row
    do {
        randomIndex = Math.floor(Math.random() * jokes.length);
    } while (randomIndex === lastIndex && jokes.length > 1);
    
    lastIndex = randomIndex;
    return jokes[randomIndex];
}

function updateCounter() {
    document.getElementById("counter-val").textContent = getRandomJoke();
}

function toggleSound() {
    const video = document.getElementById('intro-video');
    const audio = document.getElementById('intro-audio');
    const btn = document.getElementById('sound-btn');

    video.muted = !video.muted;

    if (audio.paused) {
        audio.currentTime = video.currentTime;
        audio.play();
        btn.textContent = '🔇 Mute Sound';
    } else {
        audio.pause();
        btn.textContent = '🔊 Enable Sound';
    }
}

function redirectToHome() {
    const audio = document.getElementById('intro-audio');
    audio.pause();
    window.location.href = "home/index.html";
}

// Pick a random joke immediately when page loads
updateCounter();
</script>

</body>
</html>
