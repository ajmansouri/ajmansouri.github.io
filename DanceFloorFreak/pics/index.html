<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dance Floor Freak - Photo Gallery</title>
    <meta name="description" content="dance,floor,freak,dj,dancefloorfreak,photos,gallery">
    <meta name="keywords" content="dance,floor,freak,dj,dancefloorfreak,mixing,clubbing,illinois,indiana,midwest,pix,photos">
    
    <!-- Relative paths to global directory from /pics/ -->
    <link rel="stylesheet" type="text/css" href="../global/style.css">
    
    <script src="../global/header.js"></script>
    <script src="../global/wmjava.js"></script>
    <script src="../global/rollover.js"></script>
    <script src="../global/protect.js"></script>

    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            color: #ccc;
        }
        .main-wrapper {
            width: 840px;
            margin: 0 auto;
            background-color: #000;
            min-height: 100vh;
        }
        .header-flash {
            width: 840px;
            height: 152px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }
        .header-turntable {
            width: 180px;
            height: 152px;
            object-fit: contain;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
        }
        .turntable-hidden {
            opacity: 0;
            transform: translateY(-150px);
        }
        .header-title-gif {
            max-height: 140px;
            height: auto;
        }
        .content-layout {
            display: flex;
            align-items: stretch;
            background-image: url('../global/bg_bottom.jpg');
            background-repeat: repeat;
        }
        .side-menu {
            width: 120px;
            background-image: url('../global/menubg.jpg');
            text-align: center;
        }
        .main-content {
            width: 720px;
            background-color: #000;
            vertical-align: top;
            padding: 10px;
        }
        .menu-item img {
            display: block;
            border: 0;
        }
        #sound-btn {
            background-color: #111111;
            color: #ff0000;
            border: 1px solid #ff0000;
            padding: 5px 8px;
            font-size: 9px;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            width: 90%;
            box-sizing: border-box;
        }
        #sound-btn:hover {
            background-color: #ff0000;
            color: #ffffff;
        }

        /* --- Gallery Table Styling --- */
        .gallery-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 15px;
            margin: 0 auto;
        }
        .gallery-table td {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 12px;
            text-align: center;
            vertical-align: top;
            font-size: 13px;
            color: #cccccc;
            border-radius: 4px;
            box-shadow: inset 0 0 8px #000000;
        }
        .gallery-table img {
            max-width: 100%;
            height: auto;
            border: 1px solid #333333;
            margin-bottom: 8px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .gallery-table img:hover {
            transform: scale(1.02);
            border-color: #ff0000;
        }
        .return-link {
            color: #666666;
            text-decoration: none;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }
        .return-link:hover {
            color: #ff0000;
        }
    </style>
</head>
<body>
